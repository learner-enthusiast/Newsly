name: API contract

on:
  pull_request:
  push:
    branches:
      - master
      - main

permissions:
  contents: read

jobs:
  api-contract:
    name: OpenAPI spec and API tests
    runs-on: ubuntu-latest
    env:
      # prisma generate (postinstall) reads it; nothing connects.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: OpenAPI builds and every route has schemas
        run: pnpm api:check
