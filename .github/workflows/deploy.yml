name: Deploy Dainik Samachar

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dainik-samachar-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy over SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          set -eu

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          ssh \
            -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=yes \
            "$EC2_USER@$EC2_HOST" 'bash -se' <<'REMOTE'
              set -Eeuo pipefail

              export NVM_DIR="$HOME/.nvm"
              source "$NVM_DIR/nvm.sh"

              cd /home/ubuntu/apps/dainikSamachar

              echo "Pulling latest code..."
              git fetch origin main
              git checkout main
              git pull --ff-only origin main

              echo "Installing dependencies..."
              pnpm install --frozen-lockfile

              echo "Applying database migrations..."
              pnpm db:migrate:deploy

              echo "Building Next.js..."
              pnpm build

              echo "Restarting application..."
              pm2 restart dainiksamachar --update-env
              pm2 save

              echo "Checking application health..."
              curl --fail --silent --show-error \
                --max-time 15 http://127.0.0.1:3000/ \
                -o /dev/null

              echo "Deployment completed successfully."
          REMOTE
